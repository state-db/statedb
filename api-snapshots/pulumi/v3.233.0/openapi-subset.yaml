                  name: orgName
                  required: true
                  schema:
                    type: string
                - description: The project name
                  in: path
                  name: projectName
                  required: true
                  schema:
                    type: string
                - description: The stack name
                  in: path
                  name: stackName
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateInfo'
