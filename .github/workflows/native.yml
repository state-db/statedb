name: Release build

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# On demand only. Ordinary changes are verified by ./dev check and signed off locally.
# `bin/release` requires this workflow to succeed on the exact release commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to embed in the gated candidates (X.Y.Z)
        required: true
        type: string

jobs:
  postgres-compatibility:
    name: PostgreSQL ${{ matrix.postgres-version }} migration compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["14", "16", "18"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Replay the packaged migration chain
        env:
          STATEDB_SCHEMA_PG_IMAGE: postgres:${{ matrix.postgres-version }}-alpine
        run: bin/generate-db-schema --check

  cli-battle-tests:
    name: Pulumi compatibility (${{ matrix.pulumi-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - pulumi-version: 3.234.0
            pulumi-image: pulumi/pulumi:3.234.0@sha256:5fab0c70cd50a19d0fa7c59cfbc9751d946e27418b2f3e1e4b3735ce1252818b
          - pulumi-version: 3.259.0
            pulumi-image: pulumi/pulumi:3.259.0@sha256:b126893e303fd974fdecde0dc5c1202bdaf71d0717f905edf1e1f71b64d8abc8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned verification toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.8.5
          cache: false
      - name: Run smoke and fault tiers against the real Pulumi CLI
        env:
          PULUMI_IMAGE: ${{ matrix.pulumi-image }}
        run: ./dev ci-protocol "$PULUMI_IMAGE"
      - name: Sanitize image tag for artifact name
        if: always()
        id: tag
        run: echo "tag=${{ matrix.pulumi-version }}" >> "$GITHUB_OUTPUT"
      - name: Publish State Safety Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: state-safety-report-${{ steps.tag.outputs.tag }}
          path: modules/pulumi-cli-smoke/target/state-safety-report.md
          if-no-files-found: warn

  strict-metadata-negative:
    name: Prove missing metadata rejects native authorization readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require a deliberately incomplete image to fail
        env:
          NATIVE_NEGATIVE_METADATA_TEST: "true"
          NATIVE_IMAGE_XMX: 6g
          NATIVE_IMAGE_PARALLELISM: 2
        run: |
          bin/build-native-app-image state-db:native-missing-registration
          bin/verify-native-metadata-negative state-db:native-missing-registration

  build-and-gate:
    name: Build and gate (${{ matrix.arch }})
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build native image on the target architecture
        env:
          NATIVE_IMAGE_XMX: 6g
          NATIVE_IMAGE_PARALLELISM: 2
          RELEASE_VERSION: ${{ inputs.version }}
        run: bin/build-native-app-image state-db:native-ci --version "$RELEASE_VERSION"

      - name: Generate dependency-level Java SBOM
        if: matrix.arch == 'amd64'
        run: bin/generate-java-sbom artifacts

      - name: Run image, authorization, migration, and Pulumi contracts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bin/release-gate state-db:native-ci --expect-version "$RELEASE_VERSION"

      - name: Scan the gated image
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL state-db:native-ci
          if [ "${{ matrix.arch }}" = amd64 ]; then
            docker run --rm -v "$PWD:/work" "$TRIVY_IMAGE" \
              sbom --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
              /work/artifacts/state-db-java.cdx.json
          fi
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" \
            "$TRIVY_IMAGE" image --format cyclonedx --output /work/native-container-${{ matrix.arch }}.cdx.json \
            state-db:native-ci

      # Every run publishes its candidate: bin/release assembles the release manifest
      # from the two per-architecture candidates this job pushes for the release commit.
      - name: Log in to the container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the gated architecture candidate
        env:
          CANDIDATE: ghcr.io/${{ github.repository }}-candidates:${{ github.sha }}-${{ matrix.arch }}
        run: |
          docker tag state-db:native-ci "$CANDIDATE"
          docker push "$CANDIDATE"
          digest=$(docker buildx imagetools inspect "$CANDIDATE" --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$digest" in sha256:*) ;; *) echo "invalid candidate digest: $digest" >&2; exit 1 ;; esac
          printf '%s\n' "$digest" > native-candidate-${{ matrix.arch }}.digest

      - name: Capture native build metadata
        if: always()
        run: |
          docker image inspect state-db:native-ci > native-image-${{ matrix.arch }}.json
          docker history --no-trunc state-db:native-ci > native-history-${{ matrix.arch }}.txt

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-build-${{ matrix.arch }}
          path: |
            native-image-${{ matrix.arch }}.json
            native-history-${{ matrix.arch }}.txt
            native-container-${{ matrix.arch }}.cdx.json
            native-candidate-${{ matrix.arch }}.digest
          retention-days: 14

      - name: Upload Java SBOM
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-sbom
          path: artifacts/state-db-java.cdx.json
          retention-days: 14
