name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Module tests (dev container)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('modules/**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # Same environment as local development: the dev container defined in
      # .devcontainer/devcontainer.json (JDK 21, Maven, Docker-outside-of-Docker
      # for Quarkus Dev Services and the integrity-verifier container).
      #
      # `verify` (not `test`) so the run includes the spotless:check binding and
      # the failsafe lifecycle. The Pulumi CLI smoke and fault tiers stay at
      # their opt-in defaults here (skipped); nightly.yml runs them across the
      # CLI version matrix.
      - name: Run module tests and verification
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            mvn -f modules/pom.xml verify
            ./bin/generate-third-party-notices --check

  verifier-tool:
    name: Integrity verifier (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tools/pulumi/verify/go.mod
      - name: Test and build tools/pulumi/verify
        run: make -C tools/pulumi/verify verify
      - name: Test and build tools/pulumi/recorder
        run: |
          cd tools/pulumi/recorder
          go test ./...
          go build ./...
