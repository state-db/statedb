name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Module tests (dev container)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('modules/**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # Same environment as local development: the dev container defined in
      # .devcontainer/devcontainer.json (JDK 21, Maven, Docker-outside-of-Docker
      # for Quarkus Dev Services and the integrity-verifier container).
      #
      # `verify` (not `test`) includes the spotless:check binding and failsafe
      # lifecycle. After the comprehensive suite, the app re-runs its
      # authorization tests on the pinned Mandrel JVM with the tracing agent;
      # verify then rejects reviewed Native Image reachability drift. Those tests
      # reach every Cedar path, the only reachability Quarkus cannot derive at
      # build time. The Pulumi CLI smoke and fault tiers stay at
      # their opt-in defaults here (skipped); nightly.yml runs them across the
      # CLI version matrix.
      - name: Run module tests and verification
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            ./bin/prepare-native-agent-jvm >/dev/null
            mvn -f modules/pom.xml verify -Pnative-agent-tests
            ./bin/generate-third-party-notices --check

  verifier-tool:
    name: Integrity verifier (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tools/pulumi/verify/go.mod
      - name: Test and build tools/pulumi/verify
        run: make -C tools/pulumi/verify verify
      - name: Test and build tools/pulumi/recorder
        run: |
          cd tools/pulumi/recorder
          go test ./...
          go build ./...
