{{- if not .Values.sessionExistingSecret }}
{{- $name := printf "%s-session" (include "statedb.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "statedb.labels" . | nindent 4 }}
type: Opaque
data:
  # The session key must survive upgrades: rotating it logs every user out.
  # Reuse the existing value if the Secret is already present, otherwise take
  # the supplied one, otherwise generate a random key on first install.
  session-encryption-secret: {{ if $existing }}{{ index $existing.data "session-encryption-secret" }}{{ else if .Values.sessionEncryptionSecret }}{{ .Values.sessionEncryptionSecret | b64enc }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
{{- if and .Values.database.password (not .Values.database.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "statedb.fullname" . }}-db
  labels:
    {{- include "statedb.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.database.password | b64enc }}
{{- end }}
{{- if and .Values.oidc.name .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "statedb.fullname" . }}-oidc
  labels:
    {{- include "statedb.labels" . | nindent 4 }}
type: Opaque
data:
  client-secret: {{ .Values.oidc.clientSecret | b64enc }}
{{- end }}
{{- if eq (include "statedb.breakGlassGenerated" .) "true" }}
{{- $name := include "statedb.breakGlassSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $reusable := eq (include "statedb.breakGlassReusable" .) "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "statedb.labels" . | nindent 4 }}
type: Opaque
data:
  # Reuse both keys once generated: a new bcrypt salt on every upgrade would churn the hash.
  {{- if $reusable }}
  password: {{ $existing.password }}
  password-hash: {{ index $existing "password-hash" }}
  {{- else }}
  {{- $password := randAlphaNum 48 }}
  password: {{ $password | b64enc }}
  password-hash: {{ bcrypt $password | b64enc }}
  {{- end }}
{{- end }}
