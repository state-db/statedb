apiVersion: v1
kind: Service
metadata:
  name: {{ include "statedb.fullname" . }}
  labels:
    {{- include "statedb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "statedb.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "statedb.serviceAccountName" . }}
  labels:
    {{- include "statedb.labels" . | nindent 4 }}
{{- end }}
