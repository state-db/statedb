apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "statedb.fullname" . }}
  labels:
    {{- include "statedb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "statedb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "statedb.selectorLabels" . | nindent 8 }}
      {{- $rollOnHash := eq (include "statedb.breakGlassGenerated" .) "true" }}
      {{- if or $rollOnHash .Values.podAnnotations }}
      annotations:
        {{- if $rollOnHash }}
        checksum/break-glass: {{ include "statedb.breakGlassRevision" . | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "statedb.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 45 }}
      containers:
        - name: statedb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: {{ .Values.managementPort }}
          env:
            - name: STATEDB_JDBC_URL
              value: {{ required "database.jdbcUrl is required" .Values.database.jdbcUrl | quote }}
            - name: STATEDB_DB_USER
              value: {{ required "database.user is required" .Values.database.user | quote }}
            - name: STATEDB_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.database.existingSecret }}
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretPasswordKey | quote }}
                  {{- else }}
                  name: {{ include "statedb.fullname" . }}-db
                  key: password
                  {{- end }}
            - name: STATEDB_SESSION_ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "statedb.sessionSecretName" . }}
                  key: {{ include "statedb.sessionSecretKey" . | quote }}
            {{- with .Values.bootstrap.orgName }}
            - name: STATEDB_BOOTSTRAP_ORG_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.bootstrap.orgDisplayName }}
            - name: STATEDB_BOOTSTRAP_ORG_DISPLAY_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.oidc.name }}
            - name: STATEDB_OIDC_BOOTSTRAP_NAME
              value: {{ .Values.oidc.name | quote }}
            - name: STATEDB_OIDC_BOOTSTRAP_ISSUER
              value: {{ required "oidc.issuer is required when oidc.name is set" .Values.oidc.issuer | quote }}
            - name: STATEDB_OIDC_BOOTSTRAP_CLIENT_ID
              value: {{ required "oidc.clientId is required when oidc.name is set" .Values.oidc.clientId | quote }}
            - name: STATEDB_OIDC_BOOTSTRAP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.oidc.existingSecret }}
                  name: {{ .Values.oidc.existingSecret }}
                  key: {{ .Values.oidc.existingSecretClientSecretKey | quote }}
                  {{- else }}
                  name: {{ include "statedb.fullname" . }}-oidc
                  key: client-secret
                  {{- end }}
            {{- end }}
            {{- with .Values.oidc.defaultProvider }}
            - name: STATEDB_OIDC_DEFAULT_PROVIDER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.adminSubjects }}
            - name: STATEDB_ADMIN_SUBJECTS
              value: {{ . | quote }}
            {{- end }}
            {{- if eq (include "statedb.breakGlassEnabled" .) "true" }}
            - name: STATEDB_LOCAL_GLASS_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ include "statedb.breakGlassSecretName" . }}
                  key: {{ include "statedb.breakGlassSecretKey" . | quote }}
            - name: STATEDB_LOCAL_GLASS_ALLOW_REMOTE
              value: {{ dig "allowRemote" true (.Values.breakGlass | default dict) | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Keep serving until the Service and Ingress stop routing to this pod.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.shutdownDelaySeconds | default 10 }}"]
          # Migrations run before the service serves traffic, so readiness can
          # legitimately take minutes on a cold database.
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: management
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
