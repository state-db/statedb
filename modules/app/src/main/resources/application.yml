quarkus:
  application:
    name: statedb
  # Lets in-flight journal/event PATCHes finish on scale-in or rollout instead of being cut off.
  shutdown:
    timeout: 30s
  http:
    port: 8080
    # Pulumi's CLI gzips request bodies on `/batch-decrypt` (and may on other endpoints in
    # future). Vert.x only decompresses when this is on; default is false.
    enable-decompression: true
    auth:
      # Lazy authentication keeps public routes public until they ask for SecurityIdentity. HTTP
      # permissions own the console boundary: only provider discovery and provider validation are
      # public; every other /api/* route requires a Quarkus-authenticated OIDC session.
      proactive: false
      permission:
        console-public:
          paths: /api/auth/providers,/api/auth/login,/api/auth/login/*,/api/auth/logout
          policy: permit
        console-authenticated:
          paths: /api/*
          policy: authenticated
      # Local break-glass console login: form auth in SPA mode (empty page locations → bare
      # status codes, no redirects). The mechanism is always assembled, but LocalGlass only
      # honors it while STATEDB_LOCAL_GLASS_PASSWORD_HASH is set, no oidc_providers row is
      # enabled, and the TCP source is loopback (unless STATEDB_LOCAL_GLASS_ALLOW_REMOTE=true).
      form:
        enabled: true
        post-location: /api/auth/local
        username-parameter: username
        password-parameter: password
        cookie-name: state-db-glass
        timeout: PT12H
        http-only-cookie: true
        login-page: ""
        error-page: ""
        landing-page: ""
      session:
        # Form-auth cookie encryption. Same secret that encrypts the OIDC session cookie, so one
        # env var keeps both stable across replicas; when unset Quarkus warns and uses a per-boot
        # random key (LocalGlassStartupValidator fails the boot if break-glass is configured).
        encryption-key: "${statedb.session.encryption-secret:}"
  # Health and metrics on a separate listener (:9000); the public port is internet-facing.
  management:
    enabled: true
  oidc:
    # Console providers are data: ProviderTenantConfigResolver builds a web-app tenant per request
    # from the enabled oidc_providers rows. The static default tenant is intentionally disabled so
    # startup doesn't demand an auth-server-url and the Pulumi surface stays untouched.
    tenant-enabled: false
  datasource:
    active: true
    db-kind: postgresql
    jdbc:
      metrics:
        # Agroal pool gauges; saturation is otherwise invisible until requests time out.
        enabled: true
      additional-jdbc-properties:
        # pgjdbc: turns Hibernate's insert batches into multi-row statements on the wire.
        reWriteBatchedInserts: "${statedb.db.rewrite-batched-inserts:true}"
  flyway:
    # StateDbFlywayConfiguration rejects attempts to disable this startup path
    # or weaken the migration safety settings below.
    active: true
    migrate-at-start: true
    locations: classpath:db/migration
    # Image replacement is the complete database upgrade procedure. A task does
    # not serve traffic until Flyway validates and migrates the shared database.
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    clean-at-start: false
    repair-at-start: false
    baseline-on-migrate: false
    out-of-order: false
    ignore-missing-migrations: false
    ignore-future-migrations: false
    default-schema: public
    schemas: public
    table: flyway_schema_history
    create-schemas: false
    # Stop DDL that waits indefinitely behind an application transaction. A
    # startup statement must finish within the two-minute migration budget.
    init-sql: "SET lock_timeout = '10s'; SET statement_timeout = '2min'"
    # Permit one minute of database cold-start delay. The customizer enforces a
    # five-minute migration-lock wait because Quarkus exposes no Flyway key.
    connect-retries: 10
    connect-retries-interval: 6s
  hibernate-orm:
    # Schema is owned by Flyway; Hibernate must never touch DDL.
    database:
      generation: none
    # Quarkus fixes jdbc.statement-batch-size at build time; Hibernate reads this at startup.
    unsupported-properties:
      "hibernate.jdbc.batch_size": "${statedb.db.insert-batch-size:50}"
    log:
      # Add the SQL statement when a request is slow but pool acquisition was not the cause.
      # The console's normal queries are well below this threshold.
      queries-slower-than-ms: 100
    # Use Quarkus's default JSON format mapper for JSONB columns rather than
    # the REST-facing ObjectMapper, whose date customizations would affect DB
    # serialization. Will be the default in a future Quarkus.
    mapping:
      format:
        global: ignore
  native:
    # RawApiTokens owns a process-wide SecureRandom. Cedar's package loads its JNI library and owns
    # Rust-side caches plus a Cleaner. zstd-jni extracts and loads its own .so from a static
    # initializer, so build-time init bakes in a "loaded" flag for a library the running process
    # never opened. These process resources must be created when the executable starts, not in the
    # image-builder JVM. These arguments are consumed only by native-image.
    march: compatibility
    additional-build-args: --initialize-at-run-time=app.statedb.persistence.auth.RawApiTokens,--initialize-at-run-time=com.cedarpolicy,--initialize-at-run-time=com.github.luben.zstd,--initialize-at-run-time=app.statedb.persistence.policy.PolicySetCache,--initialize-at-run-time=app.statedb.persistence.authz.Authorizer,--exact-reachability-metadata=com.cedarpolicy,--exact-reachability-metadata=app.statedb
  log:
    level: INFO

statedb:
  compaction:
    poll-interval: 10s
    per-tick-cap: 25
    claim-timeout: 5m
    max-attempts: 3
    prune:
      # Snapshots are a derived cache of the journal: a pruned one is rebuilt by
      # replaying from an older retained rung, or from the empty base. Set
      # newest-snapshots to 0 to disable pruning and keep every snapshot.
      newest-snapshots: 10
      # The two ladder bounds cap the two terms of historical-export cost, which
      # dominate on opposite workloads. journal-spacing caps rows replayed;
      # update-spacing caps whole-deployment rebuilds, which replay performs once
      # per update boundary it crosses. A rung survives once either budget is
      # spent since the previous one. Set either to 0 to deactivate that bound.
      ladder-journal-spacing: 5000
      ladder-update-spacing: 50
  events:
    archive:
      # Folding a terminal update's events into one compressed blob is a
      # representation change, not retention — every event is preserved and the
      # console serves it transparently. Set enabled to false to stop folding;
      # existing archives keep being read, and EventArchiveFolder#unfold turns
      # any of them back into rows.
      enabled: true
      # Time after an update ends before its events may be folded. Keeps the
      # console's live tail paging over rows until clients are done with it.
      grace-period: 1h
      poll-interval: 5m
      per-tick-cap: 50
  lock:
    # The CLI assumes 5m and renews at 2.5m whatever we return; LeaseRenewalFaultIT guards this.
    lease-ttl: 5m
    # Advisory; no server-side behavior keys off this today. Exposed so operators can tune the
    # CLI heartbeat cadence once the server starts surfacing it.
    heartbeat-interval: 30s

# In dev/test, no jdbc.url is set → Quarkus Dev Services starts an
# ephemeral Postgres container (requires a reachable Docker daemon).
# In prod, the URL/credentials must come from the environment.
"%prod":
  quarkus:
    datasource:
      credentials-provider: statedb
      credentials-provider-name: statedb-db-credentials-provider
      jdbc:
        url: ${STATEDB_JDBC_URL}
        # Recycling exercises credential refresh regularly. RDS IAM tokens only gate a new
        # connection, so established sessions remain valid after the 15-minute token expires.
        max-lifetime: 10m

# @TestTransaction wraps the whole test in one JTA tx; on cold-start runs the
# default 60s ceiling can fire mid-test (Dev Services boot + Flyway + first
# connection). Five minutes is generous; trim later if it masks real hangs.
"%test":
  statedb:
    # The scheduler is off below, so tests drive compaction directly; nothing would clear a job.
    lock:
      compaction-wait: 0
    oidc:
      default-provider: wiremock
    session:
      encryption-secret: state-db-test-session-secret-32-bytes
  quarkus:
    http:
      # Random free port keeps @QuarkusTest isolated from other local Quarkus processes.
      test-port: 0
    management:
      # Random port, as above; otherwise pinned to :9001.
      test-port: 0
    scheduler:
      enabled: false
    transaction-manager:
      default-transaction-timeout: 300
