quarkus:
  application:
    name: state-db
  http:
    port: 8080
    # Pulumi's CLI gzips request bodies on `/batch-decrypt` (and may on other endpoints in
    # future). Vert.x only decompresses when this is on; default is false.
    enable-decompression: true
    auth:
      # Lazy authentication keeps public routes public until they ask for SecurityIdentity. HTTP
      # permissions own the console boundary: only provider discovery and provider validation are
      # public; every other /api/* route requires a Quarkus-authenticated OIDC session.
      proactive: false
      permission:
        console-public:
          paths: /api/auth/login,/api/auth/login/*
          policy: permit
        console-authenticated:
          paths: /api/*
          policy: authenticated
  oidc:
    # Console providers are data: ProviderTenantConfigResolver builds a web-app tenant per request
    # from the enabled oidc_providers rows. The static default tenant is intentionally disabled so
    # startup doesn't demand an auth-server-url and the Pulumi surface stays untouched.
    tenant-enabled: false
  datasource:
    db-kind: postgresql
  flyway:
    migrate-at-start: true
    locations: classpath:db/migration
  hibernate-orm:
    # Schema is owned by Flyway; Hibernate must never touch DDL.
    database:
      generation: none
    # Use Quarkus's default JSON format mapper for JSONB columns rather than
    # the REST-facing ObjectMapper, whose date customizations would affect DB
    # serialization. Will be the default in a future Quarkus.
    mapping:
      format:
        global: ignore
  log:
    level: INFO

state-db:
  compaction:
    poll-interval: 10s
    per-tick-cap: 25
    claim-timeout: 5m
    max-attempts: 3
  lock:
    lease-ttl: 1h
    # Advisory; no server-side behavior keys off this today. Exposed so operators can tune the
    # CLI heartbeat cadence once the server starts surfacing it.
    heartbeat-interval: 30s

# In dev/test, no jdbc.url is set → Quarkus Dev Services starts an
# ephemeral Postgres container (requires a reachable Docker daemon).
# In prod, the URL/credentials must come from the environment.
"%prod":
  quarkus:
    datasource:
      jdbc:
        url: ${STATE_DB_JDBC_URL}
      username: ${STATE_DB_DB_USER}
      password: ${STATE_DB_DB_PASSWORD}

# @TestTransaction wraps the whole test in one JTA tx; on cold-start runs the
# default 60s ceiling can fire mid-test (Dev Services boot + Flyway + first
# connection). Five minutes is generous; trim later if it masks real hangs.
"%test":
  state-db:
    oidc:
      default-provider: wiremock
    session:
      encryption-secret: state-db-test-session-secret-32-bytes
  quarkus:
    http:
      # Random free port keeps @QuarkusTest isolated from other local Quarkus processes.
      test-port: 0
    scheduler:
      enabled: false
    transaction-manager:
      default-transaction-timeout: 300
