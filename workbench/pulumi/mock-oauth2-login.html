<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock OAuth2 Server Sign-in</title>
    <style>
      body {
        color: #222;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
      }

      header {
        border-bottom: 1px solid #e5e5e5;
        padding: 32px 24px 24px;
      }

      h1 {
        font-size: 40px;
        font-weight: 400;
        margin: 0;
      }

      main {
        margin: 36px auto;
        max-width: 384px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      input,
      textarea,
      button {
        box-sizing: border-box;
        font: inherit;
      }

      input,
      textarea {
        border: 1px solid #cfcfcf;
        border-radius: 4px;
        width: 100%;
      }

      input {
        height: 40px;
        margin-bottom: 16px;
        padding: 0 10px;
      }

      textarea {
        min-height: 280px;
        padding: 10px;
      }

      .subjects {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      .subjects button {
        background: #f7f7f7;
        border: 1px solid #d8d8d8;
        border-radius: 4px;
        cursor: pointer;
        padding: 6px 10px;
      }

      .subjects button:hover {
        background: #efefef;
      }

      .sign-in {
        background: #31bce8;
        border: 0;
        border-radius: 4px;
        color: #fff;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-top: 24px;
        padding: 12px 28px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Mock OAuth2 Server Sign-in</h1>
    </header>
    <main>
      <form method="post">
        <label for="username">Subject</label>
        <input id="username" name="username" required type="text" value="admin" autofocus />

        <div class="subjects" aria-label="Workbench users">
          <button type="button" data-subject="admin">admin</button>
          <button type="button" data-subject="developer">developer</button>
          <button type="button" data-subject="viewer">viewer</button>
        </div>

        <label for="claims">Claims JSON</label>
        <textarea id="claims" name="claims" rows="15"></textarea>

        <button class="sign-in" type="submit">Sign-in</button>
      </form>
    </main>
    <script>
      const users = {
        admin: {
          email: "admin@example.com",
          name: "Admin Owner",
          role: "owner",
          groups: ["state-db-admin", "acme-owner"],
        },
        developer: {
          email: "developer@example.com",
          name: "Developer Member",
          role: "member",
          groups: ["acme-member"],
        },
        viewer: {
          email: "viewer@example.com",
          name: "View Only",
          role: "viewer",
          groups: ["acme-viewer"],
        },
      };

      const username = document.querySelector("#username");
      const claims = document.querySelector("#claims");

      function fillClaims(subject) {
        const preset = users[subject];
        claims.value = JSON.stringify(preset ?? {}, null, 2);
      }

      document.querySelectorAll("[data-subject]").forEach((button) => {
        button.addEventListener("click", () => {
          username.value = button.dataset.subject;
          fillClaims(username.value);
        });
      });

      username.addEventListener("input", () => fillClaims(username.value));
      fillClaims(username.value);
    </script>
  </body>
</html>
