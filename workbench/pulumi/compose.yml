name: state-db-workbench

services:
  postgres:
    image: ${DB_IMAGE:-postgres:16}
    # Make pulls every image anonymously first (see pull-missing); compose never pulls or builds.
    pull_policy: never
    container_name: state-db-workbench-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-statedb}
      POSTGRES_USER: ${DB_USER:-statedb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-statedb}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 3s
      retries: 30

  idp:
    image: ${IDP_IMAGE:?run through make pulumi-workbench}
    pull_policy: never
    container_name: state-db-workbench-idp
    volumes:
      - ./mock-oauth2-login.html:/app/workbench-login.html:ro
    environment:
      JSON_CONFIG: >
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper",
          "loginPagePath": "/app/workbench-login.html"
        }
    ports:
      - "127.0.0.1:${IDP_PORT:-58081}:8080"

  # Release mode (`cmd=app`): the image with its bundled console, on the bridge network.
  app:
    profiles: [release]
    image: ${STATEDB_IMAGE:-state-db:workbench}
    pull_policy: never
    container_name: state-db-workbench-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STATEDB_JDBC_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-statedb}
      STATEDB_DB_USER: ${DB_USER:-statedb}
      STATEDB_DB_PASSWORD: ${DB_PASSWORD:-statedb}
      STATEDB_BOOTSTRAP_ORG_NAME: ${ORG:-acme}
      STATEDB_BOOTSTRAP_ORG_DISPLAY_NAME: Acme Workbench
      STATEDB_OIDC_BOOTSTRAP_NAME: mock
      STATEDB_OIDC_BOOTSTRAP_ISSUER: http://localhost:${IDP_PORT:-58081}/default
      STATEDB_OIDC_BOOTSTRAP_CLIENT_ID: console
      STATEDB_OIDC_BOOTSTRAP_CLIENT_SECRET: console-secret
      STATEDB_OIDC_DEFAULT_PROVIDER: mock
      STATEDB_SESSION_ENCRYPTION_SECRET: state-db-workbench-session-secret-32-bytes
      STATEDB_ADMIN_SUBJECTS: http://localhost:${IDP_PORT:-58081}/default:admin
      STATEDB_REPORTS_PUBLIC_BASE_URL: http://localhost:8080/
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    # The UBI Micro runtime has no curl, so probe readiness with bash builtins (as in soak).
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /q/health/ready HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r\n' >&3 &&
          read -r s <&3 && [[ $$s == *" 200 "* ]]
      interval: 2s
      timeout: 5s
      retries: 60

  # Makes the issuer URL the browser uses (localhost:IDP_PORT) reach the IdP from inside the app
  # container too. TCP passthrough keeps the Host header, so the mock IdP issues the same issuer.
  idp-loopback:
    profiles: [release]
    image: ${SHIM_IMAGE:?run through make pulumi-workbench}
    pull_policy: never
    container_name: state-db-workbench-idp-loopback
    network_mode: service:app
    depends_on:
      - app
      - idp
    command: ["TCP-LISTEN:${IDP_PORT:-58081},bind=127.0.0.1,fork,reuseaddr", "TCP:idp:8080"]

volumes:
  postgres-data:
    name: ${DB_VOLUME:-state-db-workbench-postgres-data}
    external: true
