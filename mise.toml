[settings]
experimental = true
lockfile = true
locked = true

[tools]
java = "temurin-21.0.11+10.0.LTS"
go = "1.25.8"
bun = "1.3.14"

[tasks.quick]
description = "Fast checks inside the credential-free verification VM"
run = "bin/dev-task quick"

[tasks.check-inner]
description = "Authoritative checks; called inside the isolated verification VM"
run = "bin/dev-task check"

[tasks.protocol]
description = "Pulumi smoke and fault checks inside the verification VM"
run = "bin/dev-task protocol"

[tasks.notices-inner]
description = "Regenerate dependency notices inside the verification VM"
run = "bin/dev-task notices"

[tasks.native-contract-inner]
description = "Focused native-agent metadata verification inside the verification VM"
run = "bin/dev-task native-contract"
